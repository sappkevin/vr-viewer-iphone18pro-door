<text x="23.00" y="238.00" font-family="Helvetica,Arial,sans-serif" font-size="2.7" font-weight="normal" text-anchor="start" fill="#000">50 mm — must measure exactly 50 mm at 100% / Actual Size</text>
<text x="12.00" y="180.00" font-family="Helvetica,Arial,sans-serif" font-size="3.0" font-weight="bold" text-anchor="start" fill="#000">How to test:</text>
<text x="12.00" y="185.00" font-family="Helvetica,Arial,sans-serif" font-size="3.0" font-weight="normal" text-anchor="start" fill="#000">1.  Print at 100% / Actual Size. Confirm the rulers read 100 mm and 50 mm — if not, fix scale and reprint.</text>
<text x="12.00" y="190.00" font-family="Helvetica,Arial,sans-serif" font-size="3.0" font-weight="normal" text-anchor="start" fill="#000">2.  Lay this sheet on the BACK of the phone; line the phone outline up with the real edges and top.</text>
<text x="12.00" y="195.00" font-family="Helvetica,Arial,sans-serif" font-size="3.0" font-weight="normal" text-anchor="start" fill="#000">3.  The camera plateau should sit inside the bold CUT window with a ~0.5 mm gap all around.</text>
<text x="12.00" y="200.00" font-family="Helvetica,Arial,sans-serif" font-size="3.0" font-weight="normal" text-anchor="start" fill="#000">4.  Optional: cut out the bold window and check the plateau pokes through cleanly.</text>
<text x="12.00" y="275.40" font-family="Helvetica,Arial,sans-serif" font-size="2.5" font-weight="normal" text-anchor="start" fill="#000">iPhone 18 Pro VR viewer door — 1:1 camera fit template</text>
